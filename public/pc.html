<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电脑端 · 局域网互传</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e2e4e8;
    --text: #1f2328; --text-2: #5f6368; --text-3: #9aa0a6;
    --primary: #1a73e8; --primary-dark: #1558b0; --danger: #d93025;
    --ok: #188038; --warn-bg: #fef7e0; --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body { font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 46px;
    background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topbar .brand { font-size: 15px; font-weight: 600; }
  .topbar .hint { font-size: 12px; color: var(--text-2); }
  .topbar .hint a { color: var(--primary); text-decoration: none; }

  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 12px; padding: 12px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .panel + .panel { margin-top: 12px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .panel-head h2 { font-size: 13px; font-weight: 600; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 32px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
    font-size: 13px; cursor: pointer; user-select: none; text-decoration: none; }
  .btn:active { background: #f0f1f3; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-lg { width: 100%; height: 44px; font-size: 15px; }
  .btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .btn-ghost-danger { color: var(--danger); border-color: #f3c6c2; }

  input[type="text"] { height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: #fff; color: var(--text); width: 100%; }
  input[type="text"]:focus { outline: none; border-color: var(--primary); }

  /* 左侧会话列表 */
  .sess-list { display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow: auto; }
  .sess-item { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .sess-item:hover { background: #f8f9fa; }
  .sess-item.active { border-color: var(--primary); background: #e8f0fe; }
  .sess-item .s-name { font-size: 13px; font-weight: 600; word-break: break-all; display: flex; align-items: center; gap: 6px; }
  .sess-item .s-info { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .tag { display: inline-block; padding: 0 6px; height: 16px; line-height: 16px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .tag-phone { background: #e6f4ea; color: var(--ok); }
  .tag-pc { background: #e8f0fe; color: var(--primary); }
  .empty { text-align: center; color: var(--text-3); font-size: 12px; padding: 16px 0; }

  /* 右侧：缩略图墙 */
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .cell { position: relative; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #fafafa; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .seq { position: absolute; top: 4px; left: 4px; min-width: 22px; height: 22px; padding: 0 5px;
    display: flex; align-items: center; justify-content: center; background: var(--primary); color: #fff;
    border-radius: 11px; font-size: 12px; font-weight: 700; }
  .cell .cname { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 5px; background: rgba(0,0,0,.55);
    color: #fff; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell a { position: absolute; inset: 0; }
  .cell:hover { border-color: var(--primary); }

  /* 命名模板 */
  .tpl-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .tpl-row input { font-family: var(--mono); }
  .field-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { font-size: 11px; color: var(--text-2); background: #f1f3f4; border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 7px; }
  .chip b { font-family: var(--mono); color: var(--primary); font-weight: 600; }

  .preview-wrap { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
  table.preview { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.preview th { position: sticky; top: 0; background: #f8f9fa; text-align: left; padding: 5px 10px;
    font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--border); }
  table.preview td { padding: 4px 10px; border-bottom: 1px solid #f0f1f3; white-space: nowrap; }
  table.preview td.new { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
  table.preview td.old { color: var(--text-2); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .dup-note { font-size: 11px; color: #b06000; background: var(--warn-bg); border-radius: 4px; padding: 2px 8px; display: none; }

  .progress { height: 8px; background: #eceff1; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .progress .bar { height: 100%; width: 0; background: var(--primary); transition: width .15s; border-radius: 4px; }
  .progress-label { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .result { margin-top: 8px; font-size: 12px; display: none; }
  .result.ok { display: block; color: var(--ok); }
  .result.err { display: block; color: var(--danger); }
  .sess-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .sess-title .t-name { font-size: 15px; font-weight: 600; }
  .sess-title .t-info { font-size: 12px; color: var(--text-2); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">电脑端 · 局域网互传</div>
  <div class="hint">手机端入口：<a href="/">http://&lt;本机IP&gt;:5210/</a>（启动服务时控制台有二维码）</div>
</header>

<div class="layout">
  <!-- 左列 -->
  <div>
    <section class="panel">
      <div class="panel-head">
        <h2>会话列表</h2>
        <button class="btn btn-sm" id="btnRefresh" type="button">刷新</button>
      </div>
      <div id="sessList" class="sess-list"><div class="empty">加载中…</div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>电脑 → 手机 上传</h2></div>
      <div style="margin-bottom:8px">
        <input id="pcSessionName" type="text" maxlength="60" placeholder="批次名，默认 电脑传图-MMDD-HHmm" autocomplete="off">
      </div>
      <div style="display:flex; gap:8px; align-items:center">
        <label class="btn btn-primary" for="pcFileInput" style="flex:none">＋ 选择文件</label>
        <input id="pcFileInput" type="file" multiple hidden>
        <span style="font-size:12px;color:var(--text-2)" id="pcPickMeta">未选择</span>
      </div>
      <button class="btn btn-primary" id="btnPcUpload" type="button" disabled style="width:100%;margin-top:10px">上传到手机端</button>
      <div class="progress" id="pcProgressWrap" hidden><div class="bar" id="pcProgressBar"></div></div>
      <div class="progress-label num" id="pcProgressLabel" hidden></div>
      <div class="result" id="pcResult"></div>
    </section>
  </div>

  <!-- 右列 -->
  <div>
    <section class="panel">
      <div class="sess-title" id="sessTitle"><span class="t-name">选择左侧会话查看文件</span></div>

      <div class="panel-head" style="margin-bottom:6px"><h2>批量命名模板</h2></div>
      <div class="tpl-row">
        <input id="tplInput" type="text" value="{event}_{seq}{ext}" spellcheck="false" autocomplete="off">
        <button class="btn" id="btnTplReset" type="button">恢复默认</button>
      </div>
      <div class="field-chips">
        <span class="chip"><b>{seq}</b> 3位序号（按手机上传顺序）</span>
        <span class="chip"><b>{name}</b> 原文件名去扩展名</span>
        <span class="chip"><b>{ext}</b> 扩展名含点</span>
        <span class="chip"><b>{event}</b> 批次名</span>
        <span class="chip"><b>{date}</b> 上传日期YYYYMMDD</span>
        <span class="chip"><b>{time}</b> 上传时间HHmmss</span>
        <span class="chip"><b>{orig}</b> 原始完整文件名</span>
        <span class="chip">重名自动追加 -1 / -2</span>
      </div>

      <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px">
        <button class="btn btn-primary btn-lg" id="btnDownloadZip" type="button" disabled style="flex:1">⬇ 下载全部（ZIP，按模板重命名）</button>
      </div>
      <div class="result" id="tplMsg"></div>

      <div class="panel-head" style="margin-bottom:6px"><h2>命名预览</h2><span class="dup-note" id="dupNote">⚠ 模板无区分字段，已自动追加序号去重</span></div>
      <div class="preview-wrap">
        <table class="preview">
          <thead><tr><th style="width:40px">#</th><th>原文件名</th><th>ZIP 内新文件名</th></tr></thead>
          <tbody id="previewBody"><tr><td colspan="3" class="empty">—</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>文件列表（点击图片下载单个文件）</h2></div>
      <div id="wall" class="wall"><div class="empty">—</div></div>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var sessions = [];        // 会话列表缓存
  var current = null;       // 当前选中会话详情 {id,name,direction,createdAt,files[]}
  var DEFAULT_TEMPLATE = '{event}_{seq}{ext}';

  function pad2(n) { return String(n).padStart(2, '0'); }
  function pad3(n) { return String(n).padStart(3, '0'); }
  function defaultBatchName(prefix) {
    var d = new Date();
    return prefix + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
      pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ============ 命名模板渲染（与 server.js 保持一致） ============ */

  function sanitizeName(s) {
    return String(s || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\s+/g, ' ').trim();
  }

  function renderTemplate(tpl, ctx) {
    var t = String(tpl || '').trim() || DEFAULT_TEMPLATE;
    var out = t.replace(/\{(seq|name|ext|date|time|event|orig)\}/g, function (_, k) { return ctx[k] != null ? ctx[k] : ''; });
    out = sanitizeName(out);
    if (!out) out = sanitizeName(ctx.event) + '_' + ctx.seq + ctx.ext;
    if (ctx.ext && out.toLowerCase().indexOf(ctx.ext, out.length - ctx.ext.length) === -1) out += ctx.ext;
    return out;
  }

  function buildPreview(files) {
    var tpl = $('tplInput').value;
    var created = current ? new Date(current.createdAt) : new Date();
    var event = current ? (sanitizeName(current.name) || '未命名批次') : '未命名批次';
    var date = '' + created.getFullYear() + pad2(created.getMonth() + 1) + pad2(created.getDate());
    var time = pad2(created.getHours()) + pad2(created.getMinutes()) + pad2(created.getSeconds());

    var used = {};
    var hasDup = false;
    var rows = files.map(function (f) {
      var dot = f.origName.lastIndexOf('.');
      var ext = dot >= 0 ? f.origName.slice(dot).toLowerCase() : '';
      var ctx = { seq: pad3(f.seq), name: dot >= 0 ? f.origName.slice(0, dot) : f.origName, ext: ext, date: date, time: time, event: event, orig: f.origName };
      var name = renderTemplate(tpl, ctx);
      if (used[name] !== undefined) {
        hasDup = true;
        var m = name.match(/^(.*?)(\.[^.]+)?$/);
        var base = m[1], e2 = m[2] || '';
        var i = 1;
        while (used[base + '-' + i + e2] !== undefined) i += 1;
        name = base + '-' + i + e2;
      }
      used[name] = true;
      return { orig: f.origName, zipName: name };
    });
    return { rows: rows, hasDup: hasDup };
  }

  function renderPreview() {
    var body = $('previewBody');
    if (!current || current.files.length === 0) {
      body.innerHTML = '<tr><td colspan="3" class="empty">—</td></tr>';
      $('dupNote').style.display = 'none';
      return;
    }
    var result = buildPreview(current.files);
    var rows = result.rows;
    $('dupNote').style.display = hasNoSeqField() && result.hasDup ? 'inline-block' : 'none';
    body.innerHTML = rows.map(function (r, i) {
      return '<tr><td class="num" style="color:var(--text-3)">' + (i + 1) + '</td>' +
        '<td class="old">' + esc(r.orig) + '</td><td class="new">' + esc(r.zipName) + '</td></tr>';
    }).join('');
  }

  // 模板缺少区分字段（无 {seq}/{orig}/{name}）时预览必然大量重名
  function hasNoSeqField() {
    return !/\{(seq|orig|name)\}/.test($('tplInput').value);
  }

  $('tplInput').addEventListener('input', renderPreview);
  $('btnTplReset').addEventListener('click', function () {
    $('tplInput').value = DEFAULT_TEMPLATE;
    renderPreview();
  });

  /* ============ 会话列表与详情 ============ */

  async function loadSessions() {
    try {
      var res = await fetch('/api/sessions');
      sessions = await res.json();
      var box = $('sessList');
      if (sessions.length === 0) {
        box.innerHTML = '<div class="empty">暂无会话，用手机打开首页上传图片</div>';
        return;
      }
      box.innerHTML = '';
      sessions.forEach(function (s) {
        var div = document.createElement('div');
        div.className = 'sess-item' + (current && current.id === s.id ? ' active' : '');
        div.innerHTML = '<div class="s-name"><span class="tag ' + (s.direction === 'pc' ? 'tag-pc' : 'tag-phone') + '">' +
          (s.direction === 'pc' ? '电脑' : '手机') + '</span>' + esc(s.name) + '</div>' +
          '<div class="s-info num">' + fmtTime(s.createdAt) + ' · ' + s.fileCount + ' 个文件 · ' + fmtSize(s.totalSize) + '</div>';
        div.addEventListener('click', function () { selectSession(s.id); });
        box.appendChild(div);
      });
    } catch (e) {
      $('sessList').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    }
  }

  async function selectSession(id) {
    try {
      var res = await fetch('/api/sessions/' + encodeURIComponent(id));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      current = await res.json();
      Array.prototype.forEach.call(document.querySelectorAll('.sess-item'), function (n) {
        n.classList.remove('active');
      });
      // 标记选中项
      var items = document.querySelectorAll('.sess-item');
      var idx = sessions.findIndex(function (s) { return s.id === id; });
      if (idx >= 0 && items[idx]) items[idx].classList.add('active');

      $('sessTitle').innerHTML = '<span class="t-name">' + esc(current.name) + '</span>' +
        '<span class="tag ' + (current.direction === 'pc' ? 'tag-pc' : 'tag-phone') + '">' +
        (current.direction === 'pc' ? '电脑' : '手机') + '</span>' +
        '<span class="t-info num">' + fmtTime(current.createdAt) + ' · ' + current.files.length + ' 个文件</span>';
      $('btnDownloadZip').disabled = current.files.length === 0;

      var wall = $('wall');
      if (current.files.length === 0) {
        wall.innerHTML = '<div class="empty">该批次没有文件</div>';
      } else {
        wall.innerHTML = '';
        current.files.forEach(function (f) {
          var cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerHTML = '<img alt="" loading="lazy" src="/api/file/' + encodeURIComponent(current.id) + '/' + f.seq + '?inline=1">' +
            '<span class="seq num">' + f.seq + '</span>' +
            '<span class="cname">' + esc(f.origName) + '</span>' +
            '<a href="/api/file/' + encodeURIComponent(current.id) + '/' + f.seq + '" download title="点击下载"></a>';
          wall.appendChild(cell);
        });
      }
      renderPreview();
    } catch (e) {
      alert('加载会话失败：' + e.message);
    }
  }

  $('btnRefresh').addEventListener('click', loadSessions);

  $('btnDownloadZip').addEventListener('click', function () {
    if (!current) return;
    var url = '/api/download/' + encodeURIComponent(current.id) + '?template=' + encodeURIComponent($('tplInput').value);
    location.href = url; // 浏览器自动弹下载，停留当前页
  });

  /* ============ 电脑 → 手机 上传 ============ */

  var pcFiles = [];
  $('pcFileInput').addEventListener('change', function (e) {
    pcFiles = Array.prototype.slice.call(e.target.files || []);
    var total = pcFiles.reduce(function (s, f) { return s + f.size; }, 0);
    $('pcPickMeta').textContent = pcFiles.length ? ('已选 ' + pcFiles.length + ' 个 · ' + fmtSize(total)) : '未选择';
    $('btnPcUpload').disabled = pcFiles.length === 0;
  });

  function showPcResult(cls, text) {
    var el = $('pcResult');
    el.className = 'result ' + cls;
    el.textContent = text;
  }

  $('btnPcUpload').addEventListener('click', function () {
    if (pcFiles.length === 0) return;
    var fd = new FormData();
    fd.append('sessionName', $('pcSessionName').value.trim() || defaultBatchName('电脑传图-'));
    fd.append('direction', 'pc');
    pcFiles.forEach(function (f) { fd.append('files', f, f.name); });

    var xhr = new XMLHttpRequest();
    $('btnPcUpload').disabled = true;
    $('pcProgressWrap').hidden = false;
    $('pcProgressLabel').hidden = false;
    xhr.upload.addEventListener('progress', function (e) {
      if (!e.lengthComputable) return;
      var pct = Math.round(e.loaded / e.total * 100);
      $('pcProgressBar').style.width = pct + '%';
      $('pcProgressLabel').textContent = '上传中 ' + pct + '% · ' + fmtSize(e.loaded) + ' / ' + fmtSize(e.total);
    });
    xhr.addEventListener('load', function () {
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (_) { /* 非法响应体 */ }
      if (xhr.status === 200 && data) {
        showPcResult('ok', '✅ 已上传 ' + data.count + ' 个文件到批次「' + data.name + '」，手机端首页即可查看下载');
        pcFiles = [];
        $('pcFileInput').value = '';
        $('pcPickMeta').textContent = '未选择';
        loadSessions();
      } else {
        showPcResult('err', '❌ 上传失败：' + ((data && data.error) || ('HTTP ' + xhr.status)));
      }
      $('btnPcUpload').disabled = pcFiles.length === 0;
      setTimeout(function () {
        $('pcProgressWrap').hidden = true;
        $('pcProgressLabel').hidden = true;
        $('pcProgressBar').style.width = '0';
      }, 1200);
    });
    xhr.addEventListener('error', function () {
      showPcResult('err', '❌ 网络错误');
      $('btnPcUpload').disabled = false;
    });
    xhr.open('POST', '/api/upload');
    xhr.send(fd);
  });

  /* 初始化 */
  loadSessions();
})();
</script>
</body>
</html>
